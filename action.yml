name: "pgrls — Postgres RLS linter"
description: "Lint Postgres Row-Level Security policies with pgrls — 67 rules covering broken row scoping, inverted auth checks, write-side holes, and performance traps. 20 rules with mechanical auto-fixes. Or gate a PR on a Z3-verified RLS regression with no database (mode: pr)."
author: "pgrls"

branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "What to run: 'lint' (default — lint one schema) or 'pr' (DB-free base->head regression + lint gate for a pull_request, posts a review comment)."
    required: false
    default: "lint"

  # --- lint mode ---------------------------------------------------------------
  database-url:
    description: "[lint] Postgres connection string. If omitted, pgrls reads $DATABASE_URL from the job environment."
    required: false
    default: ""
  schemas:
    description: "Comma-separated schemas (e.g. 'public,tenant'). Defaults to pgrls's own default. (Applies to live-DB/URL sources.)"
    required: false
    default: ""
  config:
    description: "Path to a pgrls.toml config file."
    required: false
    default: ""
  format:
    description: "[lint] Output format: text | json | sarif | markdown | github | junit. Defaults to 'github' (inline run annotations)."
    required: false
    default: "github"
  fail-on:
    description: "Threshold that triggers a nonzero exit. In lint mode: error | warning | info (pgrls default: warning). In pr mode this gates the DIFF: safe | breaking | requires-review | dangerous (pgrls default: dangerous)."
    required: false
    default: ""
  min-severity:
    description: "[lint] Only display findings at or above this severity: error | warning | info."
    required: false
    default: ""
  rule:
    description: "[lint] Comma-separated rule IDs to run exclusively (e.g. 'SEC001,SEC004')."
    required: false
    default: ""
  exclude-rule:
    description: "[lint] Comma-separated rule IDs to skip."
    required: false
    default: ""
  baseline:
    description: "[lint] Path to a baseline file; only findings absent from it cause a failure."
    required: false
    default: ""
  output:
    description: "[lint] Write the report to this file instead of stdout (e.g. 'pgrls.sarif' to upload to code scanning)."
    required: false
    default: ""
  args:
    description: "[lint] Extra raw arguments appended to the 'pgrls lint' invocation (escape hatch)."
    required: false
    default: ""

  # --- pr mode -----------------------------------------------------------------
  migrations:
    description: "[pr] Path to the migrations directory, repo-relative (e.g. 'supabase/migrations', 'prisma/migrations', 'db/migrate'). Required in pr mode."
    required: false
    default: ""
  base-ref:
    description: "[pr] Git ref/sha of the PR base to diff against. Defaults to the pull_request base sha."
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head-ref:
    description: "[pr] Git ref/sha of the head. Defaults to the checked-out tree (leave empty on a normal pull_request checkout)."
    required: false
    default: ""
  lint-fail-on:
    description: "[pr] Lint severity on the head that fails the gate: error | warning | info (pgrls default: warning)."
    required: false
    default: ""
  comment:
    description: "[pr] Post/update a sticky pull-request review comment with the report. Needs pull-requests: write permission. Set 'false' to skip."
    required: false
    default: "true"

  # --- shared ------------------------------------------------------------------
  version:
    description: "Pin a specific pgrls release from PyPI. Omit to install the latest release. (pr mode requires pgrls >= 0.50.0.)"
    required: false
    default: ""
  python-version:
    description: "Python version for actions/setup-python."
    required: false
    default: "3.x"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pgrls
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
        IN_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [ -n "${IN_VERSION}" ]; then
          python -m pip install --disable-pip-version-check --quiet "pgrls==${IN_VERSION}"
        else
          python -m pip install --disable-pip-version-check --quiet pgrls
        fi
        pgrls --version
        if [ "${IN_MODE}" = "pr" ] && ! pgrls pr --help >/dev/null 2>&1; then
          echo "::error::mode: pr requires pgrls >= 0.50.0 (the installed version has no 'pgrls pr'). Pin a newer release with the 'version' input."
          exit 1
        fi

    - name: Run pgrls lint
      if: ${{ inputs.mode != 'pr' }}
      shell: bash
      # Inputs are passed via env (not interpolated into the script body)
      # so a value can never be parsed as part of the command — avoids
      # GitHub Actions expression/script injection.
      env:
        IN_DATABASE_URL: ${{ inputs.database-url }}
        IN_SCHEMAS: ${{ inputs.schemas }}
        IN_CONFIG: ${{ inputs.config }}
        IN_FORMAT: ${{ inputs.format }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_MIN_SEVERITY: ${{ inputs.min-severity }}
        IN_RULE: ${{ inputs.rule }}
        IN_EXCLUDE_RULE: ${{ inputs.exclude-rule }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_ARGS: ${{ inputs.args }}
      run: |
        # No `set -e`: the step's exit status must be pgrls's own exit
        # code (the final command), so CI fails exactly when pgrls does.
        args=(lint)
        if [ -n "${IN_DATABASE_URL}" ]; then args+=(--database-url "${IN_DATABASE_URL}"); fi
        if [ -n "${IN_SCHEMAS}" ]; then args+=(--schemas "${IN_SCHEMAS}"); fi
        if [ -n "${IN_CONFIG}" ]; then args+=(--config "${IN_CONFIG}"); fi
        if [ -n "${IN_FORMAT}" ]; then args+=(--format "${IN_FORMAT}"); fi
        if [ -n "${IN_FAIL_ON}" ]; then args+=(--fail-on "${IN_FAIL_ON}"); fi
        if [ -n "${IN_MIN_SEVERITY}" ]; then args+=(--min-severity "${IN_MIN_SEVERITY}"); fi
        if [ -n "${IN_BASELINE}" ]; then args+=(--baseline "${IN_BASELINE}"); fi
        if [ -n "${IN_OUTPUT}" ]; then args+=(--output "${IN_OUTPUT}"); fi
        if [ -n "${IN_RULE}" ]; then
          IFS=',' read -ra _rules <<< "${IN_RULE}"
          for r in "${_rules[@]}"; do
            r="$(printf '%s' "$r" | xargs)"
            if [ -n "$r" ]; then args+=(--rule "$r"); fi
          done
        fi
        if [ -n "${IN_EXCLUDE_RULE}" ]; then
          IFS=',' read -ra _xrules <<< "${IN_EXCLUDE_RULE}"
          for r in "${_xrules[@]}"; do
            r="$(printf '%s' "$r" | xargs)"
            if [ -n "$r" ]; then args+=(--exclude-rule "$r"); fi
          done
        fi
        if [ -n "${IN_ARGS}" ]; then
          # shellcheck disable=SC2206  # intentional word-splitting for the escape hatch
          _extra=(${IN_ARGS})
          args+=("${_extra[@]}")
        fi
        echo "+ pgrls ${args[*]}"
        pgrls "${args[@]}"

    - name: Run pgrls PR gate
      id: prgate
      if: ${{ inputs.mode == 'pr' }}
      shell: bash
      # Inputs via env (never interpolated into the script) — injection-safe.
      env:
        PGRLS_MIGRATIONS: ${{ inputs.migrations }}
        PGRLS_BASE_REF: ${{ inputs.base-ref }}
        PGRLS_HEAD_REF: ${{ inputs.head-ref }}
        PGRLS_FAIL_ON: ${{ inputs.fail-on }}
        PGRLS_LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        PGRLS_CONFIG: ${{ inputs.config }}
        PGRLS_SCHEMAS: ${{ inputs.schemas }}
      run: bash "${GITHUB_ACTION_PATH}/pr-gate.sh"

    - name: Post pgrls PR comment
      # always(): post the report even when the gate above failed the step.
      if: ${{ always() && inputs.mode == 'pr' && inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.prgate.outputs.report-file }}
      run: |
        set -uo pipefail
        MARKER="<!-- pgrls-pr-gate -->"
        # Fall back to the fixed path if the step output is unavailable.
        if [ -z "${REPORT:-}" ] || [ ! -f "${REPORT:-}" ]; then
          REPORT="${RUNNER_TEMP:-/tmp}/pgrls-pr-report.md"
        fi
        if [ ! -f "${REPORT}" ]; then
          echo "no pgrls report to post"; exit 0
        fi
        body="$(printf '%s\n\n%s' "${MARKER}" "$(cat "${REPORT}")")"
        # Sticky: update this action's own prior comment (matched by the marker) if present.
        existing="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body != null and (.body | startswith(\"${MARKER}\"))) | .id" 2>/dev/null | head -1)"
        if [ -n "${existing}" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" >/dev/null \
            && echo "updated pgrls comment ${existing}"
        else
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null \
            && echo "created pgrls comment"
        fi
